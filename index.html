<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>RG GAMER BOY FF — User Key</title>
<style>*{box-sizing:border-box}body{margin:0;background:#fff;color:#222;font:16px Arial}main{max-width:560px;margin:38px auto;padding:16px}.card{border:1px solid #ddd;border-radius:7px;padding:22px}input,button{font:inherit;width:100%;padding:11px;margin:7px 0;border:1px solid #bbb;border-radius:5px}button{background:#eee;cursor:pointer}.muted{color:#666;font-size:13px;line-height:1.55}.message{padding:10px;background:#f5f5f5;border:1px solid #ddd;border-radius:5px;white-space:pre-wrap}a{color:#174ea6}</style></head><body><main><div class="card">
<h1>RG GAMER BOY FF</h1><h2>Redeem your access key</h2>
<p class="muted">Sign in using the same account you created on the Main Website. Enter the key provided by the website administrator. Each key can be redeemed only once.</p>
<form id="loginForm"><input id="email" type="email" placeholder="Your account email" required><input id="password" type="password" placeholder="Your account password" required><button>Sign in</button></form>
<form id="redeemForm" hidden><input id="accessKey" placeholder="Enter your access key" autocomplete="off" required><button>Redeem key</button></form>
<p id="message" class="message" aria-live="polite">Not signed in.</p>
<p class="muted"><a href="index.html">Back to Main Website</a></p>
</div></main>
<script type="module">
import {initializeApp} from "https://www.gstatic.com/firebasejs/13.3.0/firebase-app.js";
import {getAuth,signInWithEmailAndPassword,onAuthStateChanged,signOut} from "https://www.gstatic.com/firebasejs/13.3.0/firebase-auth.js";
import {getDatabase,ref,get,set} from "https://www.gstatic.com/firebasejs/13.3.0/firebase-database.js";
const firebaseConfig = {
  apiKey: "AIzaSyAQc3Nefy1-4ndquvJAH6uFoZE9jw3eCa",
  authDomain: "rg-gamer-boy-ff-website-system.firebaseapp.com",
  databaseURL: "https://rg-gamer-boy-ff-website-system-default-rtdb.asia-southeast1.firebasedatabase.app",
  projectId: "rg-gamer-boy-ff-website-system",
  storageBucket: "rg-gamer-boy-ff-website-system.firebasestorage.app",
  messagingSenderId: "705401797172",
  appId: "1:705401797172:web:8afbfa27cef04889546861",
  measurementId: "G-QJQJY6ZQYF"
};
const app=initializeApp(firebaseConfig),auth=getAuth(app),db=getDatabase(app),$=id=>document.getElementById(id),say=t=>$('message').textContent=t;
$('loginForm').onsubmit=async e=>{e.preventDefault();try{await signInWithEmailAndPassword(auth,$('email').value.trim(),$('password').value);say('Signed in.');}catch(err){say(err.message)}};
onAuthStateChanged(auth,async user=>{if(user){$('loginForm').hidden=true;$('redeemForm').hidden=false;try{const p=(await get(ref(db,'users/'+user.uid+'/profile'))).val()||{};if(p.keyHash){const claim=(await get(ref(db,'keyRedemptions/'+p.keyHash))).val();if(claim===user.uid)say('An access key is already redeemed for this account. You can return to the Main Website.')}}catch(e){say('Could not check account: '+e.message)}}});
async function sha(text){const b=await crypto.subtle.digest('SHA-256',new TextEncoder().encode(text));return [...new Uint8Array(b)].map(x=>x.toString(16).padStart(2,'0')).join('')}
$('redeemForm').onsubmit=async e=>{e.preventDefault();const user=auth.currentUser;if(!user){say('Please sign in first.');return}try{
 const key=$('accessKey').value.trim().toUpperCase();if(key.length<10)throw new Error('Please enter the complete access key.');
 const hash=await sha(key),keySnap=await get(ref(db,'accessKeys/'+hash));
 if(!keySnap.exists()||keySnap.val()?.enabled!==true)throw new Error('This key is invalid or disabled.');
 const profileRef=ref(db,'users/'+user.uid+'/profile'),profile=(await get(profileRef)).val()||{};
 if(profile.keyHash){const old=(await get(ref(db,'keyRedemptions/'+profile.keyHash))).val();if(old===user.uid)throw new Error('This account already has a redeemed key.')}
 const claimRef=ref(db,'keyRedemptions/'+hash),existing=await get(claimRef);
 if(existing.exists())throw new Error('This key has already been redeemed.');
 await set(claimRef,user.uid);
 await set(ref(db,'users/'+user.uid+'/profile/keyHash'),hash);
 say('Access key redeemed successfully. Return to the Main Website and sign in.');
 $('accessKey').value='';
 }catch(err){say(err.message)}
};
</script></body></html>
